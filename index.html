<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Vote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#F8F9F6; --ink:#26302B; --muted:#5E6B63;
  --accent:#3F7D6B; --accent-ink:#FFFFFF; --track:#DCE3DC; --line:#C9D3CA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2220; --surface:#232C29; --ink:#DCE5DF; --muted:#9AAAA1;
    --accent:#7CB9A4; --accent-ink:#13201B; --track:#2F3A36; --line:#3A4742;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2220; --surface:#232C29; --ink:#DCE5DF; --muted:#9AAAA1;
  --accent:#7CB9A4; --accent-ink:#13201B; --track:#2F3A36; --line:#3A4742;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.125rem; line-height:1.6;
}
main{max-width:40rem; margin:0 auto; padding:2rem 1.25rem 3rem}
h1{font-size:1.75rem; line-height:1.3; margin:0 0 .5rem; font-weight:700}
.hint{color:var(--muted); margin:0 0 1.75rem; font-size:1rem}
.options{display:grid; gap:.875rem; margin:0; padding:0; list-style:none}
.opt{
  position:relative; width:100%; text-align:left; font:inherit; color:inherit;
  background:var(--surface); border:2px solid var(--line); border-radius:14px;
  padding:1rem 1.125rem; min-height:3.5rem; cursor:pointer; overflow:hidden;
}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,summary:focus-visible,textarea:focus-visible{
  outline:3px solid var(--accent); outline-offset:3px;
}
.opt .fill{
  position:absolute; inset:0 auto 0 0; background:var(--track); width:0;
  transition:width .5s ease;
}
.opt .row{position:relative; display:flex; justify-content:space-between; gap:1rem; align-items:center}
.opt .pct{font-weight:700; white-space:nowrap}
.opt.mine{border-color:var(--accent)}
.opt.mine .fill{background:color-mix(in srgb,var(--accent) 28%,var(--track))}
.opt[disabled]{cursor:default}
.meta{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.75rem; margin-top:1.25rem; color:var(--muted); font-size:1rem}
.btn{
  font:inherit; font-weight:700; border-radius:12px; padding:.7rem 1.1rem; min-height:2.75rem;
  border:2px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer;
}
.btn.quiet{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.quiet:hover{border-color:var(--accent)}
details{margin-top:2.5rem; border-top:1px solid var(--line); padding-top:1.25rem}
summary{cursor:pointer; font-weight:700; min-height:2.75rem; display:flex; align-items:center}
label{display:block; margin:1rem 0 .35rem; font-weight:700; font-size:1rem}
input{width:100%; font:inherit; color:var(--ink); background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:.75rem 1rem}
input:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--surface);
  border:2px solid var(--line); border-radius:12px; padding:.75rem 1rem; resize:vertical;
}
.actions{margin-top:1rem; display:flex; gap:.75rem; flex-wrap:wrap}
.msg{min-height:1.5rem; margin-top:.75rem; color:var(--muted); font-size:1rem}
@media (prefers-reduced-motion: reduce){.opt .fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="q"></h1>
  <p class="hint" id="hint">Loading the poll…</p>
  <ul class="options" id="list"></ul>
  <div class="meta">
    <span id="total"></span>
    <button class="btn quiet" id="change" hidden>Change my vote</button>
  </div>

  <details>
    <summary>Start a new poll (admin)</summary>
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off">
    <label for="newq">Question</label>
    <textarea id="newq" rows="2"></textarea>
    <label for="newopts">Options (one per line, 2 to 8)</label>
    <textarea id="newopts" rows="5"></textarea>
    <div class="actions">
      <button class="btn" id="create">Start poll</button>
      
    </div>
    <div class="msg" id="msg" role="status"></div>
  </details>
</main>

<script>
(function(){
  var SUPABASE_URL = "https://ywfovfupmeqhmetbqcel.supabase.co";
  var SUPABASE_KEY = "sb_publishable_NMXAuXSx_Ctl_sq4k7Xnug_qdaJ1_N4";
  var $ = function(id){ return document.getElementById(id); };
  var list = $("list");
  var poll = null, results = [], mine = null, busy = false;

  function token(){
    try{
      var t = localStorage.getItem("quickvote:token");
      if(!t){ t = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()) + "-voter"; localStorage.setItem("quickvote:token", t); }
      return t;
    }catch(e){ return window.__t || (window.__t = String(Math.random()).slice(2) + Date.now() + "-voter-session"); }
  }
  var TOKEN = token();

  function api(path, opts){
    opts = opts || {};
    return fetch(SUPABASE_URL + "/rest/v1/" + path, {
      method: opts.method || "GET",
      headers: {apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json"},
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.text().then(function(t){
        var j = t ? JSON.parse(t) : null;
        if(!r.ok) throw new Error((j && j.message) || "Request failed");
        return j;
      });
    });
  }
  function say(t){ $("msg").textContent = t || ""; }

  function render(){
    if(!poll){ return; }
    var t = results.reduce(function(n,r){ return n + Number(r.votes); }, 0), voted = mine !== null;
    $("q").textContent = poll.question;
    $("hint").textContent = voted ? "Thanks for voting. Results update every few seconds." : "Pick one option to see the results.";
    list.innerHTML = "";
    results.forEach(function(r){
      var li = document.createElement("li"), b = document.createElement("button");
      var isMine = mine === r.option_id;
      b.className = "opt" + (isMine ? " mine" : "");
      b.disabled = voted || busy;
      var pct = t ? Math.round(Number(r.votes) / t * 100) : 0;
      var fill = document.createElement("span"); fill.className = "fill";
      var row = document.createElement("span"); row.className = "row";
      var name = document.createElement("span"); name.textContent = r.label + (isMine ? " (your vote)" : "");
      row.appendChild(name);
      if(voted){
        var p = document.createElement("span"); p.className = "pct"; p.textContent = pct + "% (" + r.votes + ")"; row.appendChild(p);
        fill.style.width = pct + "%";
      }
      b.appendChild(fill); b.appendChild(row);
      if(!voted) b.addEventListener("click", function(){ vote(r.option_id); });
      li.appendChild(b); list.appendChild(li);
    });
    $("total").textContent = t + (t === 1 ? " vote" : " votes");
    $("change").hidden = !voted;
  }

  function refresh(){
    if(!poll) return Promise.resolve();
    return Promise.all([
      api("rpc/get_results", {method:"POST", body:{p_poll: poll.id}}),
      api("rpc/get_my_vote", {method:"POST", body:{p_poll: poll.id, p_token: TOKEN}})
    ]).then(function(r){ results = r[0]; mine = r[1]; render(); })
      .catch(function(){ say("Can’t reach the poll right now. Retrying…"); });
  }

  function loadPoll(){
    return api("polls?active=eq.true&select=id,question&order=created_at.desc&limit=1").then(function(rows){
      if(!rows.length){ $("q").textContent = "No poll yet"; $("hint").textContent = "Start one in the admin section below."; poll = null; list.innerHTML = ""; return; }
      var changed = !poll || poll.id !== rows[0].id;
      poll = rows[0];
      if(changed){ results = []; mine = null; }
      return refresh();
    }).catch(function(){ $("hint").textContent = "Can’t reach the poll right now."; });
  }

  function vote(optionId){
    busy = true; say("");
    api("rpc/cast_vote", {method:"POST", body:{p_option: optionId, p_token: TOKEN}})
      .then(refresh).catch(function(e){ say(e.message); })
      .then(function(){ busy = false; render(); });
  }

  $("change").addEventListener("click", function(){
    api("rpc/remove_vote", {method:"POST", body:{p_poll: poll.id, p_token: TOKEN}}).then(refresh).catch(function(e){ say(e.message); });
  });

  $("create").addEventListener("click", function(){
    var q = $("newq").value.trim();
    var opts = $("newopts").value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    if(!q){ say("Add a question first."); return; }
    if(opts.length < 2 || opts.length > 8){ say("Enter between 2 and 8 options, one per line."); return; }
    api("rpc/create_poll", {method:"POST", body:{p_question:q, p_options:opts, p_admin_key:$("key").value}})
      .then(function(){ say("New poll started."); $("newq").value = ""; $("newopts").value = ""; return loadPoll(); })
      .catch(function(e){ say(e.message); });
  });

  loadPoll();
  setInterval(function(){ if(!document.hidden) loadPoll(); }, 4000);
})();
</script>
</body>
</html>
